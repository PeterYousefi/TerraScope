name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ENABLE_OPENAI: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: lovable/package-lock.json
      - name: Install backend
        run: |
          python -m venv backend/.venv
          backend/.venv/bin/python -m pip install -e './backend[test]'
      - name: Backend tests and lint
        run: |
          backend/.venv/bin/python -m pytest backend/tests -q
          backend/.venv/bin/ruff check backend/app backend/tests backend/live_smoke.py
      - name: Install frontend
        working-directory: lovable
        run: npm ci
      - name: Frontend checks
        working-directory: lovable
        run: |
          npm test
          npm run typecheck
          npm run lint
          npm run build
      - name: Install Chromium
        working-directory: lovable
        run: npx playwright install --with-deps chromium
      - name: Browser acceptance
        working-directory: lovable
        run: npm run test:e2e
      - name: Build and verify single-process hosting
        working-directory: lovable
        run: |
          STATIC_HOSTING=true VITE_API_BASE_URL=/ npm run build
          STATIC_DIR="$GITHUB_WORKSPACE/lovable/dist/client" DATABASE_URL=sqlite:////tmp/terrascope-hosted-ci.db ../backend/.venv/bin/python -m uvicorn app.main:app --app-dir ../backend --host 127.0.0.1 --port 8002 &
          hosted_pid=$!
          trap 'kill "$hosted_pid"' EXIT
          node scripts/verify-hosted.mjs http://127.0.0.1:8002
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: lovable/test-results/
          if-no-files-found: ignore
          retention-days: 7
